name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux deps
        run: |
          sudo apt update
          sudo apt install -y build-essential pkg-config libasound2-dev \
            libxkbcommon-dev libwayland-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, fedora-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux deps (Debian)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt update
          sudo apt install -y build-essential pkg-config libasound2-dev \
            libxkbcommon-dev libwayland-dev ffmpeg

      - name: Linux deps (Fedora)
        if: matrix.os == 'fedora-latest'
        run: |
          sudo dnf install -y gcc gcc-c++ make pkgconf-pkg-config \
            alsa-lib-devel libxkbcommon-devel wayland-devel ffmpeg

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets
      - run: cargo test --all
